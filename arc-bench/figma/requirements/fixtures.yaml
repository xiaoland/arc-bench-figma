version: 1
contract: The environment creates the selected document starting state. Subsequent
  edits use the UI. Reopening the same workset restores its saved editable document.
defaults:
  page: Desktop
  history: empty
  zoom: 1
  canvasOrigin:
    x: 0
    y: 0
  selection: []
  fill: '000000'
  opacity: 1
  stroke: null
  shadow: null
  cornerRadius: 0
  font:
    family: Inter
    style: Regular
    size: 12
    lineHeight: auto
  order: Within one parent, objects array order is back to front. siblingIndex starts
    at zero.
  identity: Names are public aliases. The application assigns persistent IDs to continuing
    layers within a workset. Detach and clipboard reconstruction can create replacement
    IDs as specified by the relevant behavior.
  geometry: x/y are relative to parent, or to the page for top-level layers. Layout
    determines effective geometry. parent describes the actual document hierarchy.
  type_defaults:
    frame:
      fill: FFFFFF
    rectangle:
      fill: D9D9D9
    text:
      textSizing: fixed
      fill: '000000'
  view:
    panX: 0
    panY: 0
  image_crop_offset: cropOffsetX/Y use host-local units for the image center's displacement
    from the host center. An untransformed centered Fill has zero offset. Source pixels,
    rendered image size, and layer geometry remain separate values.
