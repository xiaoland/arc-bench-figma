  name: Continue canvas edits after panel and window resizing
  acceptance:
    version: 1
    mode: scripted
    seed: selection
    protocol:
    - name: 面板与视口空间
      actions: 从Layers选Select A并Fit selection；记录浏览器内容区域、左右面板及Design canvas当前边界。分别从两侧宽度调整边缘加宽再收窄，最后在保留主要编辑区域可用的范围内改变浏览器内容宽高；逐次记录区域尺寸与工具栏位置。
      expected: 左右面板可调宽，中央可用区域随面板/窗口布局伸缩；底部工具栏相对工作区定位。此阶段对象身份、内容、几何、父子关系与选择保持；不以固定侧栏像素或pan常量判断。
      evidence: 每次调整后的UI区域边界、关键截图、选择与文档状态记录。
