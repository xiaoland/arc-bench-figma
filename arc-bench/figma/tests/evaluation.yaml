  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 对象组织与继续编辑
      actions: 从blank创建包含Frame和其它对象的Section，选中Section按Delete/Backspace，Undo；再按Mac Cmd+Delete或Windows Ctrl+Backspace仅移除容器；重做/撤销并保存重开后继续编辑内容。
      expected: 普通删除移除整个子树，Undo恢复；仅移除容器保留原子项身份、内容及画布位置。结构和名称能够保存重开并继续编辑。
      evidence: 操作前后画布、Layers、Design与必要文档几何/身份记录；历史或重开结果分别记录。
