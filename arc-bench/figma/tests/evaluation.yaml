- requirement: EDIT-11
  name: Use temporary Hand from a selected layer
  acceptance:
    version: 1
    mode: scripted
    seed: editing
    protocol:
    - name: 临时导航
      actions: 从Layers选Nested内Red，确认Move、100%和画布工具焦点；先按住Space，再从Red内部按下拖动，松指针后松Space。
      expected: 只改变视口；Red几何、父级和身份保持，恢复Move及Red选择。
      evidence: 连续输入视频或事件与画面序列、导航前后视口和对象几何/父级、工具激活状态。
    - name: 恢复直接操纵
      actions: 在Red新的可见位置从其内部拖动，核对文档位移和Design。
      expected: 移动同一Red，按当前Zoom换算位移；画布、Layers及Design指向同一对象。
      evidence: 对象身份及拖动前后屏幕/文档坐标、可见选框与属性。
- requirement: EDIT-11
  name: Select and drag after scroll and zoom
  acceptance:
    version: 1
    mode: scripted
    seed: editing
    protocol:
    - name: 滚动与缩放
      actions: 通过Layers选择Nested内Red，记录视口及文档几何；用普通滚动/触控板平移，再以平台缩放修饰键滚轮或捏合改变Zoom。记录使用的设备及修饰键。
      expected: 视口位置和比例按输入变化；文档对象身份、几何及父级保持。
      evidence: 设备/平台说明、输入与画面序列、视口及对象前后读数。
    - name: 变换后命中
      actions: 从Red新可见位置重新选择并拖动，记录起终点。
      expected: 命中同一Red，文档位移等于按当前Zoom换算的输入位移，视口偏移未写入对象。
      evidence: 命中位置截图、对象身份、文档/屏幕位移和Design读数。
- requirement: SAVE-01
  name: Keep edit history during canvas navigation
  acceptance:
    version: 1
    mode: scripted
    seed: paint
    protocol:
    - name: 编辑后导航再撤销
      actions: 选择Paint，将Fill从D9D9D9提交为FF0000并离开字段；H平移、V回Move、Zoom150%、Fit selection和Fit all；在画布焦点执行一次Undo及一次Redo。
      expected: 导航只改变视口；一次Undo恢复灰色，一次Redo恢复红色，二者保持导航后的视口状态。
      evidence: 完整输入顺序、每阶段画布/Fill、视口和工具状态；Undo/Redo后的对象身份/几何。
- requirement: FLOW-03
  name: Switch between temporary Hand, object drag, and text input
  acceptance:
    version: 1
    mode: scripted
    seed: selection
    protocol:
    - name: 导航后直接操纵
      actions: 在100%、零平移、Move画布焦点下选择Select A；Space先按住，再从(50,40)拖到(90,70)，松指针和Space；从新的A内部(90,70)拖到(114,86)。
      expected: 前次只平移视口40×30，恢复Move及A选择；后次只移动A到文档(44,36)，B及父级保持。
      evidence: 连续手势、工具恢复、两对象身份和文档几何、视口及Layers/Design。
    - name: 属性与正文焦点往返
      actions: 选择B将Width改80并Enter，离开字段后Undo；Text工具在空白创建文本，输入Draft及尾随空格，Escape后回Move。
      expected: B宽度80后恢复60，A位置保持；正文为Draft加空格，正文空格不触发导航；画布、Layers与Design对应当前对象。
      evidence: 字段提交及Undo、正文输入/退出画面与焦点记录、A/B几何和文本内容。
- requirement: EDIT-08
  name: Commit and cancel Chinese text composition
  acceptance:
    version: 1
    mode: scripted
    seed: text
    protocol:
    - name: 组合提交与取消
      actions: 记录macOS、Apple简体拼音和正文焦点；Paragraph已有Draft，光标在末尾，nihao首候选为你好。逐键输入n/i/h/a/o并以Space确认；再输入相同五键，按Escape，随后按Space。
      expected: 正文为Draft你好ni hao及一个尾随空格。第一条Space提交你好；Escape后的Space跟在Latin文本后。已提交文字保留，视口和图层位置保持。
      evidence: 真实输入法按键、候选或预编辑态与各次Space/Escape后的正文画面；记录候选窗是否实际可见，不能以粘贴中文代替组合输入。
    - name: 退出并重新编辑
      actions: 退出正文编辑，重新进入同一文本层。
      expected: 正文保持Draft你好ni hao及一个尾随空格，可继续编辑同一层。
      evidence: 编辑退出/恢复过程、对象身份和正文、画布视口及图层位置。
- requirement: CREATE-01
  name: Click to create top-level and nested Frames
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 工具入口与点按创建
      actions: 从空白经工具栏Frame点按空白处创建顶层，再重新选择Frame并在其内部点按；记录两次创建的选择、边界、Layers与Design。
      expected: 两Frame初始均100×100，后者真实属于前者，当前选择与边界及检查器一致；返回Move后均能继续操纵。
