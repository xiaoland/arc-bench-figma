- requirement: FLOW-02
  name: Create editable Frame, shape, and text content
  acceptance:
    version: 1
    seed: blank
    stages:
    - name: 新Frame
      actions:
      - type: click
        target:
          role: button
          name: Frame
          exact: true
      - type: drag
        target:
          role: region
          name: Design canvas
          exact: true
        from:
          x: 20
          y: 20
        to:
          x: 340
          y: 260
      - type: renameSelection
        value: New frame
      assertions:
      - source: observe
        object: New frame
        path: geometry.width
        equals: 320
      - source: observe
        object: New frame
        path: geometry.height
        equals: 240
      - source: ui
        locator:
          testId: layer-name:New frame
        state: text
        equals: New frame
      - source: ui
        locator:
          testId: layer:New frame
        state: selected
        equals: true
    - name: 子矩形
      actions:
      - type: click
        target:
          role: button
          name: Rectangle
          exact: true
      - type: drag
        target:
          role: region
          name: Design canvas
          exact: true
        from:
          x: 40
          y: 40
        to:
          x: 200
          y: 120
      - type: renameSelection
        value: New rectangle
      assertions:
      - source: observe
        object: New rectangle
        path: parentId
        equalsObjectId: New frame
      - source: observe
        object: New rectangle
        path: geometry.width
        equals: 160
      - source: ui
        locator:
          role: textbox
          name: Width
          exact: true
        state: value
        equals: '160'
    - name: 可编辑文字
      actions:
      - type: click
        target:
          role: button
          name: Text
          exact: true
      - type: click
        target:
          role: region
          name: Design canvas
          exact: true
        position:
          x: 40
          y: 160
      - type: fill
        target:
          role: textbox
          name: Text editor
          exact: true
        value: Arc Bench
      - type: press
        key: Escape
      - type: renameSelection
        value: New title
      assertions:
      - source: observe
        object: New title
        path: text
        equals: Arc Bench
      - source: observe
        object: New title
        path: parentId
        equalsObjectId: New frame
      - source: ui
        locator:
          testId: layer-name:New title
        state: text
        equals: New title
      - source: ui
        locator:
          testId: layer:New title
        state: selected
        equals: true
    - name: 子椭圆
      actions:
      - type: press
        key: Escape
      - type: press
        key: o
      - type: drag
        target:
          role: region
          name: Design canvas
          exact: true
        from:
          x: 240
          y: 50
        to:
          x: 300
          y: 110
      - type: renameSelection
        value: New ellipse
      assertions:
      - source: observe
        object: New ellipse
        path: type
        equals: ellipse
      - source: observe
        object: New ellipse
        path: parentId
        equalsObjectId: New frame
      - source: observe
        object: New ellipse
        path: geometry.width
        equals: 60
      - source: observe
        object: New ellipse
        path: geometry.height
        equals: 60
      - source: ui
        locator:
          testId: layer-name:New ellipse
        state: text
        equals: New ellipse
      - source: ui
        locator:
          testId: layer:New ellipse
        state: selected
        equals: true
    scope: declared_automated_steps_only
- requirement: CREATE-01
  name: Create a Frame and move its child content
  acceptance:
    version: 1
    seed: blank
    stages:
    - name: 创建与核对外框
      actions:
      - type: click
        target: {role: button, name: Frame, exact: true}
      - type: drag
        target: {role: region, name: Design canvas, exact: true}
        from: {x: 40, y: 40}
        to: {x: 280, y: 220}
      assertions:
      - source: observe
        object: Frame
        path: type
        equals: frame
      - source: observe
        object: Frame
        path: parentId
        equals: null
      - source: observe
        object: Frame
        path: geometry
        equals: {x: 40, y: 40, width: 240, height: 180}
      - source: observe
        object: Frame
        path: fill.color
        equals: FFFFFF
      - source: observe
        object: Frame
        path: selected
        equals: true
      - source: ui
        locator: {testId: 'layer:Frame'}
        state: selected
        equals: true
      - source: ui
        locator: {role: textbox, name: Width, exact: true}
        state: value
        equals: '240'
      - source: ui
        locator: {role: textbox, name: Height, exact: true}
        state: value
        equals: '180'
      - source: ui
        locator: {role: textbox, name: Fill, exact: true}
        state: value
        equals: FFFFFF
      - source: ui
        locator: {role: checkbox, name: Clip content, exact: true}
        state: checked
        equals: true
    - name: 在框内创建矩形
      actions:
      - type: renameSelection
        value: Eval frame
      - type: click
        target: {role: button, name: Rectangle, exact: true}
      - type: drag
        target: {role: region, name: Design canvas, exact: true}
        from: {x: 80, y: 80}
        to: {x: 130, y: 125}
      - type: renameSelection
        value: Eval child
      assertions:
      - source: observe
        object: Eval child
        path: type
        equals: rectangle
      - source: observe
        object: Eval child
        path: parentId
        equalsObjectId: Eval frame
      - source: observe
        object: Eval child
        path: geometry
        equals: {x: 40, y: 40, width: 50, height: 45}
      - source: ui
        locator: {testId: 'layer:Eval child'}
        state: selected
        equals: true
    - name: 在画布上拖动父框
      actions:
      - type: click
        target: {testId: 'layer:Eval frame'}
      - type: click
        target: {role: button, name: Move, exact: true}
      - type: drag
        target: {role: region, name: Design canvas, exact: true}
        from: {x: 230, y: 185}
        to: {x: 350, y: 280}
      assertions:
      - source: observe
        object: Eval frame
        path: geometry
        equals: {x: 160, y: 135, width: 240, height: 180}
      - source: observe
        object: Eval frame
        path: id
        sameAs: {stage: 创建与核对外框, object: Frame, path: id}
      - source: observe
        object: Eval child
        path: parentId
        equalsObjectId: Eval frame
      - source: observe
        object: Eval child
        path: geometry
        sameAs: {stage: 在框内创建矩形, object: Eval child, path: geometry}
      - source: ui
        locator: {testId: 'layer:Eval frame'}
        state: selected
        equals: true
      - source: ui
        locator: {role: textbox, name: X, exact: true}
        state: value
        equals: '160'
      - source: ui
        locator: {role: textbox, name: Y, exact: true}
        state: value
        equals: '135'
    - name: 检查旧位置的画布命中
      actions:
      - type: click
        target: {role: region, name: Design canvas, exact: true}
        position: {x: 105, y: 100}
        modifiers: [ControlOrMeta]
      assertions:
      - source: observe
        object: Eval child
        path: selected
        equals: false
      - source: ui
        locator: {testId: 'layer:Eval child'}
        state: selected
        equals: false
    - name: 在随父移动后的新位置选中同一子层
      actions:
      - type: click
        target: {role: region, name: Design canvas, exact: true}
        position: {x: 225, y: 195}
        modifiers: [ControlOrMeta]
      assertions:
      - source: observe
        object: Eval child
        path: id
        sameAs: {stage: 在框内创建矩形, object: Eval child, path: id}
      - source: observe
        object: Eval child
        path: selected
        equals: true
      - source: ui
        locator: {testId: 'layer:Eval child'}
        state: selected
        equals: true
    scope: declared_automated_steps_only
- requirement: CREATE-02
  name: Create and edit different shape types
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 创建不同类型
      actions: 从空白创建Frame，在其中拖画矩形、椭圆及一条线/箭头。
      expected: 类型、几何或端点、父级与可见轮廓相符。
      evidence: 工具选择、图层类型/归属与画布记录。
    - name: 继续编辑
      actions: 在Layers或画布选择单个形状，改变其尺寸及适用的填充/描边。
      expected: 该对象独立改变且其他形状不变，未转为图像。
      evidence: 修改前后可见结果与属性记录。
- requirement: CREATE-03
  name: Create text by click and drag
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 单击创建并再次编辑
      actions: 选择Text工具单击画布，输入正文，退出再进入修改。
      expected: 正文可再次修改，初始Auto width模式成立。
      evidence: 创建/编辑记录、正文和尺寸模式。
    - name: 拖框及名称区分
      actions: 拖画另一文本框输入正文，退出并重命名图层。
      expected: 初始Fixed size框保留，名称与正文分别存储和显示。
