- requirement: CREATE-04
  name: Move a Group and edit a member
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 对象组织与继续编辑
      actions: 从blank用形状工具创建两个分离的同级对象，选中后Group。通过画布选择Group并移动，再从Layers单选一个成员并移动；选择Group后Ungroup。
