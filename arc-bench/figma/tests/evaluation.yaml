- requirement: FLOW-02
  name: Create, reuse, maintain, reopen, and export a design
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 从空白建立两页界面
      actions: 从正常新建设计文件入口进入空白文档。在Desktop和Mobile页面分别创建桌面与移动Frame；通过工具栏、Layers和Design面板加入标题、正文、图片和SVG图标，使用tests/fixtures/quadrants-120x80.png和tests/fixtures/arrow-24.svg；在画布直接选择并再次编辑文字。
      expected: 起点无设计对象；终点两页各有可辨识的列表界面，标题、卡片正文、图片和图标均为对应可编辑对象且父子关系正确。不是预载文档、扁平图片或仅改图层名。
      evidence: 起点及两页成稿截图、图层树/只读对象快照、文字再次编辑前后记录。
    - name: 建立布局与复用关系
      actions: 在同文件创建Card源与文字Style、颜色Style；卡片内使用纵向布局，列表使用横向Wrap。通过Assets放入至少两个桌面实例与一个移动实例；为其中一个实例设置不同正文覆盖。为独立标题和卡片正文绑定文字Style，为独立对象和源绑定颜色Style。
      expected: 实例仍引用同一源，独立对象与复用对象均可通过Style维护；标签与图像不靠预计算坐标伪装布局。桌面列表宽度可容纳两列，移动宽度仅容纳一列；宽度、子项min宽、padding和gap由操作者记录并满足该条件，不固定字体度量或断行临界值。
      evidence: 对象/来源/Style关系表、布局参数及两种宽度下画布截图。
    - name: 改变内容与宽度并维护
      actions: 增加一个列表实例，延长其中正文并使用Auto height/Hug；收窄桌面列表使两列变一列，再撤销恢复两列。修改源的未覆盖外观、文字Style和颜色Style。
      expected: 增删及正文增高触发父布局重算，相邻卡片不遮挡；收窄按公开布局规则换行，Undo恢复刚才宽度及布局，早先正文覆盖保留。共享更新传播到应关联的两页对象，局部覆盖仍在；移动页不跟随桌面Frame宽度变化。响应式不要求自动断点切换组件。
      evidence: 每次修改前后宽度、层级、布局、覆盖和Style快照；两页截图并记录与规则计算的对应关系。
    - name: 保存重开后继续编辑
      actions: 等待正常保存就绪，关闭旧标签，从同一文档入口新开；记录恢复后再改源外观、一个实例正文和列表间距。
      expected: 页面、对象、布局、源与Style关系及覆盖仍在；重开后的源修改继续传播、实例编辑不破坏源、列表重排仍有效。保存提示或静态恢复画面不能单独通过。
      evidence: 原文档身份、关闭/新开记录、重开前后关系快照及重开后编辑的可见结果。
    - name: 导出可用交付物
      actions: 从所选桌面或移动Frame的Export面板导出PNG，并从图标导出SVG，打开实际下载文件与当前设计对照。
      expected: PNG像素尺寸等于Frame尺寸乘选定倍率且包含所选Frame当前内容；SVG保留可渲染矢量路径与当前颜色/描边，范围正确。不接受空白、旧图、错误Frame或仅文件头有效。导出后文档仍可编辑；PNG/SVG不承担恢复设计文件职责。
        解码/渲染真实PNG和SVG，比较导出时的图形、文字、颜色与层次；重开后的图片/向量无需再次导入，且可继续修改。
      evidence: 实际下载文件、导出对象与倍率记录、PNG解码/SVG渲染预览及与画布的内容对照。
