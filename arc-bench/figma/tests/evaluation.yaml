version: 1
specification_version: 0.3.1
scenarios:
- requirement: SAVE-03
  name: Export PNG at two scales and continue text edit
  acceptance:
    version: 1
    seed: export
    stages:
    - name: 基线
      actions:
      - type: click
        target:
          testId: layer:Export frame
      assertions:
      - source: observe
        object: Export frame
        path: id
        exists: true
      - source: ui
        locator:
          role: region
          name: Design canvas
          exact: true
        state: visible
        equals: true
    - name: 一倍导出
      actions:
      - type: click
        target:
          role: button
          name: Add export
          exact: true
      - type: click
        target:
          role: button
          name: Export format
          exact: true
      - type: click
        target:
          role: option
          name: PNG
          exact: true
      - type: fill
        target:
          role: textbox
          name: Export scale
          exact: true
        value: '1'
      - type: press
        target:
          role: textbox
          name: Export scale
          exact: true
        key: Enter
      - type: download
        target:
          role: button
          name: Export Export frame
          exact: true
        artifact: frame-1x.png
      assertions:
      - source: observe
        object: Export frame
        path: id
        sameAs:
          stage: 基线
          object: Export frame
          path: id
      - source: ui
        locator:
          role: button
          name: Export Export frame
          exact: true
        state: visible
        equals: true
      - source: artifact
        artifact: frame-1x.png
        format: png
        width: 320
        height: 240
        samples:
        - {region: [0.69, 0.08, 0.15, 0.25], color: 'FFFFFF', minPixels: 25}
        - {region: [0.1, 0.13, 0.4, 0.24], color: '3366FF', minPixels: 25}
        - {region: [0.06, 0.5, 0.65, 0.2], color: '000000', minPixels: 15}
    - name: 二倍导出
      actions:
      - type: fill
        target:
          role: textbox
          name: Export scale
          exact: true
        value: '2'
      - type: press
        target:
          role: textbox
          name: Export scale
          exact: true
        key: Enter
      - type: download
        target:
          role: button
          name: Export Export frame
          exact: true
        artifact: frame-2x.png
      assertions:
      - source: observe
        object: Export frame
        path: id
        sameAs:
          stage: 基线
          object: Export frame
          path: id
      - source: ui
        locator:
          role: button
          name: Export Export frame
          exact: true
        state: visible
        equals: true
      - source: artifact
        artifact: frame-2x.png
        format: png
        width: 640
        height: 480
        samples:
        - {region: [0.69, 0.08, 0.15, 0.25], color: 'FFFFFF', minPixels: 25}
        - {region: [0.1, 0.13, 0.4, 0.24], color: '3366FF', minPixels: 25}
        - {region: [0.06, 0.5, 0.65, 0.2], color: '000000', minPixels: 15}
    - name: 导出后编辑
      actions:
      - type: click
        target:
          testId: layer:Export text
      - type: press
        key: Enter
      - type: fill
        target:
          role: textbox
          name: Text editor
          exact: true
        value: Still editable
      - type: press
        key: Escape
      assertions:
      - source: observe
        object: Export text
        path: text
        equals: Still editable
      - source: ui
        locator:
          testId: layer-name:Export text
        state: text
        equals: Export text
      - source: ui
        locator:
          testId: layer:Export text
        state: selected
        equals: true
    scope: declared_automated_steps_and_rendered_artifact_regions
- requirement: SAVE-04
  name: Export a Frame with vector shapes
  acceptance:
    version: 1
    seed: export
    stages:
    - name: SVG下载
      actions:
      - type: click
        target:
          testId: layer:Export frame
      - type: click
        target:
          role: button
          name: Add export
          exact: true
      - type: click
        target:
          role: button
          name: Export format
          exact: true
      - type: click
        target:
          role: option
          name: SVG
          exact: true
      - type: download
        target:
          role: button
          name: Export Export frame
          exact: true
        artifact: frame.svg
      assertions:
      - source: observe
        object: Export text
        path: text
        equals: Arc Bench
      - source: ui
        locator:
          role: button
          name: Export Export frame
          exact: true
        state: visible
        equals: true
      - source: artifact
        artifact: frame.svg
        format: svg
        vectorOnly: true
        outlineText: true
        samples:
        - {region: [0.69, 0.08, 0.15, 0.25], color: 'FFFFFF', minPixels: 25}
        - {region: [0.1, 0.13, 0.4, 0.24], color: '3366FF', minPixels: 25}
        - {region: [0.06, 0.5, 0.65, 0.2], color: '000000', minPixels: 15}
    - name: 源可编辑
