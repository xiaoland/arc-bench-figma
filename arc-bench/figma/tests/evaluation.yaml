  acceptance:
    version: 1
    mode: scripted
    seed: editing
    protocol:
    - name: 建立长内容条件
      actions: 使用editing文档，展开Workspace/Nested；通过普通复制添加足够多的形状，使Layers超出可见高度。选择Title，在主要区域仍可用的桌面窗口高度下使Design属性内容也超出可见高度；记录准备完成后的Canvas
        viewport、pan/zoom及对象状态。
      expected: 长内容条件确实成立；当前页Desktop，Title正文Draft title、字号16，Mobile为空。准备动作与后续滚动分别记录，不把复制/窗口布局变化当作滚动副作用。
      evidence: 起点截图、可见列表/属性与溢出区域记录、文档/视图快照。
    - name: 局部滚动与选择类型
      actions: 在Layers内容上滚动到不可见部分，再返回选择Title；在Design上滚动到Export后回Typography，将字号从16改20并提交。由Layers选择Workspace。
      expected: 面板内容可达；滚动过程中画布pan/zoom及文档状态不变，画布与工具栏仍在工作区。字号修改只影响Title；选择Workspace后Design显示Frame适用属性，不沿用Title文字编辑目标。
      evidence: 滚动前后含工作区的截图或录像、Title与Workspace选择态和属性读数；文档状态比较将显式字号编辑单独列出。
    - name: 切页并继续编辑
      actions: 通过Pages切Mobile，创建一个矩形；回Desktop从Layers选Title，将字号20改18并提交，再从画布选择该对象继续编辑。
      expected: Mobile的Layers与Design对应Mobile上下文，新矩形只属于Mobile；返回后Desktop原有关系保留，Title正文不变、字号18，可继续编辑。画布/Layers/Design所指对象一致；不要求恢复先前滚动位置或具体视口锚点。
      evidence: 两页选择及内容截图、字号/对象归属/身份快照、继续操作记录。
- requirement: FILL-EDIT
  name: Edit the current layer after selection changes
  acceptance:
    version: 1
    mode: scripted
    seed: paint
    protocol:
    - name: 分别编辑两对象
      actions: 记录Paint/Circle身份、父级、几何与opacity。由Layers选Paint，点Fill色样，设置FF0000与alpha60%，显式关闭颜色编辑器；再由Layers选Circle，打开其Fill并设置0000FF，关闭编辑器。
      expected: Paint红色Fill alpha0.6，Circle蓝色Fill alpha1；两者图层opacity仍1。每一步Fill行与画布对应当前对象；只有被编辑的Fill变化。
      evidence: 每次选中及编辑器状态截图、可见画布、文档快照及更改对照。
    - name: 重新打开与浮层内部输入
      actions: 选Paint重新打开Fill，读取颜色及alpha；记录选择/几何后在编辑器Hue或二维选色区操作。若浮层覆盖对象区域，记录该处输入；未出现覆盖则另用工具栏覆盖区核控件输入归属，不人为移动文档伪造默认浮层位置。随后显式关闭颜色编辑器。
      expected: 重开先显示FF0000/60%。调色结果同步Paint Fill行和画布，Circle保持蓝色；选择、身份、父级、几何及图层opacity不因浮层操作改变。所需控件可用，退出后可从Design继续编辑。
      evidence: 重开读数、调色录像及操作区域截图、前后选择/几何与Fill快照；覆盖输入子检查明确注明已观察或未覆盖，不能用后者宣布该部分通过。
    - name: 多选颜色反馈
      actions: 同时选择Paint和Circle，查看Design的Selection colors，再分别单选读回Fill。
      expected: 多选颜色汇总与两个对象当前Fill一致，不冒充首个对象的单一Fill值。单选可重新打开各自Paint，显示各自颜色及alpha，仍可独立编辑。
      evidence: 多选与分别单选的Design/画布截图、对应Fill读数。
