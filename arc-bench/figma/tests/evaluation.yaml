      expected: 画布重绘、选框、命中及Design指向同一A；只有明确的对象拖动改变其位置，B保持。Fit使用当前可见区域使A进入视口。
      evidence: 调整后命中/拖动及Fit的实际位置、视图变换、文档状态和画布/面板结果。
- requirement: FLOW-03
