- requirement: EDIT-11
  name: Navigate without changing layer geometry
  acceptance:
    version: 1
    seed: editing
    stages:
    - name: 基线
      actions:
      - type: click
        target:
          testId: layer:Nested
      assertions:
      - source: observe
        object: Nested
        path: id
        exists: true
      - source: ui
        locator:
          role: region
          name: Design canvas
          exact: true
        state: visible
        equals: true
    - name: 改变缩放
      actions:
      - type: click
        target:
          role: button
          name: Zoom options
          exact: true
      - type: fill
        target:
          role: textbox
          name: Zoom
          exact: true
        value: 150%
      - type: press
        target:
          role: textbox
          name: Zoom
          exact: true
        key: Enter
      - type: press
        key: Escape
      assertions:
      - source: observe
        object: Nested
        path: id
        sameAs:
          stage: 基线
          object: Nested
          path: id
      - source: observe
        object: Nested
        path: geometry
        equals:
          x: 40
          y: 40
          width: 300
          height: 220
      - source: observe
        object: $document
        path: view.zoom
        equals: 1.5
      - source: ui
        locator:
          role: button
          name: Zoom options
          exact: true
        state: text
        equals: 150%
    - name: 平移视图
      actions:
      - type: press
        key: h
      - type: drag
        target:
          role: region
          name: Design canvas
          exact: true
        from:
          x: 700
          y: 500
        to:
          x: 740
          y: 530
      - type: press
        key: v
      assertions:
      - source: observe
        object: Nested
        path: geometry
        equals:
          x: 40
          y: 40
          width: 300
          height: 220
      - source: observe
        object: $document
        path: view.panX
        deltaFrom:
          stage: 改变缩放
          object: $document
          path: view.panX
          delta: 40
      - source: observe
        object: $document
        path: view.panY
        deltaFrom:
          stage: 改变缩放
          object: $document
          path: view.panY
          delta: 30
      - source: observe
        object: $document
        path: view.zoom
        equals: 1.5
      - source: ui
        locator:
          role: button
          name: Zoom options
          exact: true
        state: text
        equals: 150%
    - name: 适配选中与全部
      actions:
      - type: click
        target:
          testId: layer:Nested
      - type: press
        key: Shift+2
      - type: press
        key: Shift+1
      assertions:
      - source: observe
        object: Nested
        path: id
        sameAs:
          stage: 基线
          object: Nested
          path: id
      - source: observe
        object: Nested
        path: geometry.width
        equals: 300
      - source: ui
        locator:
          role: region
          name: Design canvas
          exact: true
        state: visible
        equals: true
    scope: declared_automated_steps_only
