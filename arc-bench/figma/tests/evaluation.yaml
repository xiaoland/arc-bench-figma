  name: Undo and redo a Group bounds change
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 对象组织与继续编辑
      actions: 从blank创建并成组两个形状；移动一项越过原联合范围，再Undo、Redo；另对成组和Ungroup操作做历史往返。
      expected: 边界取决于成员联合范围，移动历史恢复成员几何与对应边界；成组/解组历史恢复真实成员关系，没有静态贴图或丢失对象。
      evidence: 操作前后画布、Layers、Design与必要文档几何/身份记录；历史或重开结果分别记录。
- requirement: CREATE-05
  name: Create a Section and organize content
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 对象组织与继续编辑
      actions: 从blank创建有内容的Frame；从Region组Section拖画并双击标题命名，移动区域收纳Frame，扩大边界并在空白部分创建嵌套Section，拖标题移动外层。分别点击内部Frame、标题及Layers，最后将Frame移出到空白画布并Undo。
      expected: 区域标题与树归属一致；调整边界不缩放Frame，整体移动带动子树和嵌套Section；内容保持可编辑，Section不截获内部Frame的普通命中。移出解除对应归属，Undo恢复；Section不成为Frame或Group的子层。
      evidence: 操作前后画布、Layers、Design与必要文档几何/身份记录；历史或重开结果分别记录。
