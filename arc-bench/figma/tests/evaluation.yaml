- requirement: COMP-02
  name: Define Text, Boolean, and Instance swap properties
  acceptance:
    version: 1
    mode: scripted
    seed: blank
    protocol:
    - name: 建立定义
      actions: 从空白通过工具栏建立文字、图形及图标主组件，建立含嵌套图标实例的主组件；先从属性入口打开创建流程并取消一个未提交定义，确认未新增定义；再通过主组件及子层的属性入口定义Text、Boolean和Instance
        swap并绑定目标。
      expected: 三种定义具有名称/默认值/目标绑定，未把普通对象冒充嵌套实例；取消尚未提交定义不留下残缺绑定。
      evidence: 空白起点、定义面板和对应子层关系记录。
    - name: 消费自建属性
      actions: 从Assets插入两个实例，在一个实例上设置不同文字、隐藏再显示图标、将嵌套来源替换为另一个自建图标；改变源默认正文。
      expected: 实例属性入口来自刚建立的定义；覆盖和源传播分别生效，另一实例及源不被局部操作改写，显隐触发适用布局重算。
      evidence: 两实例与源属性/文字/来源对照、画布变化，保留创建到消费的连续操作证据。
